# iOS Simulator セッションを張る caller workflow。実体は bannzai/simtunnel の session.yml（reusable workflow）。
# 参照: https://github.com/bannzai/simtunnel の PROJECT.md「各アプリ repo での実行」
name: simulator-session
# run-name は local/simtunnel CLI が run を特定するキーのためこの形式を維持する
run-name: "session=${{ inputs.session }} device=${{ inputs.device }}"

on:
  workflow_dispatch: # fork PR に Secrets を渡さないため workflow_dispatch のみ
    # session / device / duration_minutes は local/simtunnel の up が常に送るため宣言必須
    # （未定義の input を送ると dispatch が拒否される）
    inputs:
      session:
        description: "セッション名。tailnet ホスト名 simtunnel-<session> になる（小文字英数字とハイフンのみ）"
        required: true
        default: alarmify
      device:
        description: "Simulator のデバイス名"
        required: true
        default: iPhone 17
      duration_minutes:
        description: "セッション維持時間（分）"
        required: true
        default: "60"
      bundle_id:
        description: "起動するアプリ（ストア画像の確認時は撮影用アプリを選択）"
        type: choice
        options:
          - com.bannzai.Alarmify
          - com.bannzai.Alarmify.AppStoreScreenshots
        default: com.bannzai.Alarmify

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ライセンス生成プラグインを準備
        if: inputs.bundle_id != 'com.bannzai.Alarmify.AppStoreScreenshots'
        run: bash scripts/prepare_license_list_plugin.sh
      - name: 検証用アプリをビルド
        if: inputs.bundle_id != 'com.bannzai.Alarmify.AppStoreScreenshots'
        run: |
          mkdir -p tmp
          make build-ios > tmp/oss-build.log 2>&1
      - name: 検証用アプリを梱包
        if: inputs.bundle_id != 'com.bannzai.Alarmify.AppStoreScreenshots'
        run: ditto -c -k --keepParent tmp/DerivedData/Build/Products/Debug-iphonesimulator/Alarmify.app tmp/Alarmify.zip
      - name: ストア画像用アプリをビルドして梱包
        if: inputs.bundle_id == 'com.bannzai.Alarmify.AppStoreScreenshots'
        run: |
          mkdir -p tmp
          xcodebuild build -project Alarmify.xcodeproj -scheme AppStoreScreenshotsUITests \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath tmp/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES > tmp/oss-build.log 2>&1
          ditto -c -k --keepParent tmp/DerivedData/Build/Products/Debug-iphonesimulator/AppStoreScreenshots.app tmp/Alarmify.zip
          bash scripts/generate_header_creative/generate_header_creative.sh > tmp/header-creative.log 2>&1
      - name: ヘッダーと OGP 画像を保存
        if: inputs.bundle_id == 'com.bannzai.Alarmify.AppStoreScreenshots'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: creative-assets
          path: |
            fastlane/creative_assets/
            docs/og.png
            tmp/header-creative.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulator-app
          path: tmp/Alarmify.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: oss-build-evidence
          path: |
            tmp/oss-build.log
            Alarmify.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  session:
    needs: build
    # id-token: write が必要なのは reusable workflow を呼ぶこの job だけのため、job 単位で最小権限にする
    permissions:
      id-token: write # Tailscale の OIDC (workload identity federation) 認証に必要
      contents: read
    # タグ運用はしないため main の commit SHA で固定する（更新時は SHA を書き換える）
    uses: bannzai/simtunnel/.github/workflows/session.yml@82f8e8f60eec1bf19f5889e08f219b59bbc146ee # main 2026-08-12
    with:
      session: ${{ inputs.session }}
      device: ${{ inputs.device }}
      duration_minutes: ${{ inputs.duration_minutes }}
      app_artifact: simulator-app
      bundle_id: ${{ inputs.bundle_id }}
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_OIDC_AUDIENCE: ${{ secrets.TS_OIDC_AUDIENCE }}
