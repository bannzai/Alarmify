name: API 中継 Worker の検証と配信

on:
  push:
    branches: [main]
    paths: ['scripts/api-proxy/**', '.github/workflows/api-proxy-deploy.yml']
  pull_request:
    paths: ['scripts/api-proxy/**', '.github/workflows/api-proxy-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm test --prefix scripts/api-proxy

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages の配信と同じ Cloudflare アカウントの認証を使うため、environment も共有する
    environment:
      name: cloudflare-pages
      url: https://api.signalarm.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: api.signalarm.app の Worker を配信
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.123.0 deploy --config scripts/api-proxy/wrangler.toml
