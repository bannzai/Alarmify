name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# チェックアウトとビルドしかしないため、トークンには読み取りだけを与える
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # public repo のため macOS runner は無料 (private では使わない方針の例外)
  build-and-test:
    runs-on: macos-26
    if: ${{ !contains(github.event.pull_request.title, '[Skip CI]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: ライセンス生成プラグインを準備
        run: bash scripts/prepare_license_list_plugin.sh
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Alarmify.xcodeproj -scheme Alarmify \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build
      # スクリーンショット基盤 (AppStoreScreenshots / 各 UITest) のコンパイル腐敗を検出する。UITest の実行はしない
      - name: Build screenshot targets
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Alarmify.xcodeproj -scheme AppStoreScreenshotsUITests \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES
          xcodebuild build-for-testing -project Alarmify.xcodeproj -scheme AlarmifySnapshotUITests \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Alarmify.xcodeproj -scheme Alarmify \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES test

  # Firebase Functions (バックエンド) の lint とエミュレータ上のテスト
  functions:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.title, '[Skip CI]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      # npm ci が依存パッケージのインストールスクリプトを実行するため、チェックアウトの認証情報を残さない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      # Firestore エミュレータの実行に JDK が必要
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
