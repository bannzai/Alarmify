name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# チェックアウトとビルドしかしないため、トークンには読み取りだけを与える
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # public repo のため macOS runner は無料 (private では使わない方針の例外)
  build-and-test:
    runs-on: macos-26
    if: ${{ !contains(github.event.pull_request.title, '[Skip CI]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project Alarmify.xcodeproj -scheme Alarmify \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build
      - name: Test
        run: |
          set -o pipefail
          xcodebuild -project Alarmify.xcodeproj -scheme Alarmify \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES test

  # Firebase Functions (バックエンド) の lint とエミュレータ上のテスト
  functions:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.title, '[Skip CI]') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      # npm ci が依存パッケージのインストールスクリプトを実行するため、チェックアウトの認証情報を残さない
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # Firestore エミュレータの実行に JDK が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
