# managed-by: setup-ci (bannzai/castle)
name: ci-e2e

on:
  schedule:
    # 日本時間の朝に結果を確認できる時刻とし、毎時 0 分の混雑を避ける。
    - cron: '23 20 * * *'
  workflow_dispatch:
  # workflow 自体の導入・変更はマージ前に実行確認する。
  pull_request:
    paths:
      - '.github/workflows/ci-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-ui-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode のバージョンを確認
        run: xcodebuild -version
      - name: 既存の画面遷移・多言語表示テストを実行
        run: |
          set -o pipefail
          mkdir -p tmp
          xcodebuild test -project Alarmify.xcodeproj -scheme AlarmifySnapshotUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -resultBundlePath tmp/snapshot-ui-tests.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee tmp/e2e.log
      - name: テスト結果とログを保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-ui-tests
          path: |
            tmp/snapshot-ui-tests.xcresult
            tmp/e2e.log
          if-no-files-found: error
          retention-days: 7
